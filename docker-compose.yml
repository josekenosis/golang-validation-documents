services:
  postgres:
    image: postgres:15-alpine
    container_name: validation_postgres
    environment:
      POSTGRES_USER: validation_user
      POSTGRES_PASSWORD: validation_pass
      POSTGRES_DB: validation_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U validation_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: validation_api
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: validation_user
      DB_PASSWORD: validation_pass
      DB_NAME: validation_db
      DB_SSLMODE: disable
      JWT_SECRET: your-secret-key-change-in-production
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

